
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guinea Pig Pedigree</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <!-- PCBA HEADER -->
        <header class="brand-header">
            <img src="logo.jpg" alt="PCBA Logo">
        </header>


        <!-- PEDIGREE CONTENT -->
        <main class="pedigree-container">

            <!-- SUBJECT GUINEA PIG -->
            <section class="subject-section">

                <div class="section-title">
                    Subject Guinea Pig
                </div>


                <!-- SUBJECT INFORMATION -->
                <div class="subject-card">

                    <!-- PHOTO -->
                    <div class="photo-box">

                        <img id="subjectPhoto" src="" alt="Guinea Pig">

                        <div id="photoPlaceholder">
                            Upload Photo
                        </div>

                        <input
                            type="file"
                            id="photoInput"
                            accept="image/*"
                        >

                    </div>


                    <!-- SUBJECT DETAILS -->
                    <div class="subject-fields">

                        <div class="field">
                            <label>Name:</label>
                            <input type="text">
                        </div>

                        <div class="field">
                            <label>Breed:</label>
                            <input type="text">
                        </div>

                        <div class="field">
                            <label>Color/Markings:</label>
                            <input type="text">
                        </div>

                        <div class="field">
                            <label>Sex:</label>
                            <input type="text">
                        </div>

                        <div class="field">
                            <label>Date of Birth:</label>
                            <input type="date">
                        </div>

                        <div class="field">
                            <label>PCBA Ear Tag #:</label>
                            <input type="text">
                        </div>

                        <div class="field">
                            <label>Breeder:</label>
                            <input type="text">
                        </div>

                        <div class="field">
                            <label>Owner:</label>
                            <input type="text">
                        </div>

                        <div class="field">
                            <label>Origin:</label>
                            <input type="text">
                        </div>

                    </div>

                </div>


                <!-- NOTES -->
                <div class="notes-box">

                    <label>Notes:</label>

                    <textarea></textarea>

                </div>

            </section>


            <!-- PARENTS -->
            <section class="generation">

                <div class="generation-title">
                    Parents
                </div>


                <div class="generation-content">

                    <!-- BOAR -->
                    <div class="parent-card">

                        <div class="animal-title">
                            Boar
                        </div>

                        <div class="animal-fields">

                            <div class="field">
                                <label>Registration No.:</label>
                                <input type="text">
                            </div>

                            <div class="field">
                                <label>Name:</label>
                                <input type="text">
                            </div>

                            <div class="field">
                                <label>Breed:</label>
                                <input type="text">
                            </div>

                            <div class="field">
                                <label>Owner:</label>
                                <input type="text">
                            </div>

                        </div>

                    </div>


                    <!-- SOW -->
                    <div class="parent-card">

                        <div class="animal-title">
                            Sow
                        </div>

                        <div class="animal-fields">

                            <div class="field">
                                <label>Registration No.:</label>
                                <input type="text">
                            </div>

                            <div class="field">
                                <label>Name:</label>
                                <input type="text">
                            </div>

                            <div class="field">
                                <label>Breed:</label>
                                <input type="text">
                            </div>

                            <div class="field">
                                <label>Owner:</label>
                                <input type="text">
                            </div>

                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
